[project]
name = "specloop-api"
version = "0.1.0"
description = "SpecResearch Loop API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "httpx2>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
